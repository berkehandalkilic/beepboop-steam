version: '3.5'
services:
  steam:
    build:
      context: .
      dockerfile: Dockerfile.client
      shm_size: '500mb'
    shm_size: '500mb'
    ports:
      - 127.0.0.1:5900:5900 # VNC LAN only
      - 3001:8081 # Node web server
    volumes:
      - ./config.json:/beepboop/config.json:ro
      - ./steam/:/home/beepboop/.steam/:rw
    environment:
      - STEAM_USERNAME=${STEAM_USERNAME}
      - STEAM_PASSWORD=${STEAM_PASSWORD}
      - MODE=client
      - DB_CONNECTION=postgres://beepboop:beepboop@db/beepboop
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: "exit 0"
      
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=beepboop
      - POSTGRES_PASSWORD=beepboop
      - POSTGRES_DB=beepboop
    expose:
      - 5432
    volumes: 
      - postgres_data_v16:/var/lib/postgresql/data

volumes:
  postgres_data_v16: